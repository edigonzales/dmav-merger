name: build and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21 for Gradle
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Build with Gradle (SNAPSHOT)
        if: ${{ github.ref == 'refs/heads/main' }}
        id: buildSnapshotLib
        run: ./gradlew clean build

      - name: Validate release tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build with Gradle (RELEASE)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        id: buildReleaseLib
        shell: bash
        run: ./gradlew clean build -DreleaseVersion="${GITHUB_REF_NAME#v}"

      - name: List JVM artifacts
        if: always()
        run: |
          ls -la build/libs || true

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: reports
          path: build/reports/tests/
          if-no-files-found: ignore

      - name: Upload JVM snapshot artifact
        if: ${{ github.ref == 'refs/heads/main' && steps.buildSnapshotLib.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: jvm-snapshot-${{ github.sha }}
          path: build/libs/dmav-*-SNAPSHOT-all.jar
          retention-days: 14
          if-no-files-found: error

      - name: Upload JVM release artifact
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.buildReleaseLib.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: jvm-release
          path: build/libs/dmav-*-all.jar
          if-no-files-found: error

  native:
    name: native-${{ matrix.target }}
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            executable: dmav
            asset: dmav-linux-x86_64
          - target: windows-x86_64
            runner: windows-latest
            executable: dmav.exe
            asset: dmav-windows-x86_64.exe
          - target: osx-aarch_64
            runner: macos-14
            executable: dmav
            asset: dmav-osx-aarch_64

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21 for Gradle
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up GraalVM Community JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          set-java-home: 'false'

      - name: Build native image
        shell: bash
        run: ./gradlew nativeCompile

      - name: Smoke-test native image
        shell: bash
        run: build/native/nativeCompile/${{ matrix.executable }} --help

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p build/native-releases
          cp "build/native/nativeCompile/${{ matrix.executable }}" "build/native-releases/${{ matrix.asset }}"

      - name: Upload native image
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.target }}
          path: build/native-releases/${{ matrix.asset }}
          if-no-files-found: error

      - name: Upload native build reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: native-report-${{ matrix.target }}
          path: build/reports/native/
          if-no-files-found: ignore

  release:
    name: release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - build
      - native
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21 for Gradle
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download Linux native image
        uses: actions/download-artifact@v7
        with:
          name: native-linux-x86_64
          path: build/native-releases

      - name: Download Windows native image
        uses: actions/download-artifact@v7
        with:
          name: native-windows-x86_64
          path: build/native-releases

      - name: Download macOS native image
        uses: actions/download-artifact@v7
        with:
          name: native-osx-aarch_64
          path: build/native-releases

      - name: Download JVM release artifact
        uses: actions/download-artifact@v7
        with:
          name: jvm-release
          path: build/libs

      - name: Verify release assets
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          test -f "build/libs/dmav-${release_version}-all.jar"
          test -f build/native-releases/dmav-linux-x86_64
          test -f build/native-releases/dmav-windows-x86_64.exe
          test -f build/native-releases/dmav-osx-aarch_64
          ls -la build/libs build/native-releases

      - name: Release library and native images
        shell: bash
        run: ./gradlew -s jreleaserRelease -DreleaseVersion="${GITHUB_REF_NAME#v}"
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
